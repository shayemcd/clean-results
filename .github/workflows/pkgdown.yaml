# Builds the documentation site and publishes it to the gh-pages branch.
# Manual and release-triggered on purpose: GitHub Pages needs a public repo
# (or a paid plan). After making the repo public, run this workflow once from
# the Actions tab (it creates the gh-pages branch), then enable Pages under
# Settings > Pages > Source: "Deploy from a branch" > gh-pages.
on:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: >-
            any::pkgdown,
            local::.,
            any::rmarkdown,
            any::lme4,
            any::lmerTest,
            any::reformulas,
            any::MASS,
            any::effectsize,
            any::svglite
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
